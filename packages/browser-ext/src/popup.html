<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 300px;
        padding: 16px;
        font-family: sans-serif;
        margin: 0;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .logo {
        font-size: 18px;
        font-weight: 600;
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 16px;
      }
      .stat {
        background: #f3f4f6;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
      }
      .stat-value {
        font-size: 24px;
        font-weight: 700;
      }
      .stat-label {
        font-size: 12px;
        color: #6b7280;
      }
      label {
        display: block;
        font-size: 12px;
        margin: 8px 0 4px;
        color: #374151;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #16a34a;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="logo">DevPulse</span>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="commits">-</div>
        <div class="stat-label">Commits Today</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="prs">-</div>
        <div class="stat-label">Open PRs</div>
      </div>
    </div>
    <label for="apiUrl">API URL</label>
    <input id="apiUrl" placeholder="http://localhost:3001" />
    <label for="token">Session token</label>
    <input id="token" type="password" placeholder="Paste session token" />
    <button id="save" type="button">Save</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
